name: CI

on:
  pull_request:
  push:
    branches: [main, '[0-9]*.x'] # Not release-please's own release-please--branches--1.x.
  # Weekly, to catch DDEV HEAD changes and new zizmor findings.
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-actions:
    name: Lint actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose # List the checked files, since a clean run prints nothing.
      - name: Run zizmor
        if: ${{ !cancelled() }} # Also report zizmor's findings when actionlint fails.
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true

  # Starts DDEV before the action, so the action restarts it.
  cache-save:
    name: cache-save (${{ matrix.fixture }}, DDEV ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        # The last release of each minor from the minimum in action.yml, the latest release, and HEAD.
        # When DDEV releases a new minor, add the previous minor's last release (e.g. '1.25.x' once v1.26.0 is out).
        version: ['1.23.5', '1.24.10', latest, head]
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
        fixture: [ddevProjComposerNpm, ddevProjYarn1, ddevProjYarn4]
        include:
          - fixture: ddevProjComposerNpm
            install: ddev composer install && ddev npm ci && ddev exec --dir /var/www/html/web/themes/custom/example npm ci
          - fixture: ddevProjYarn4
            install: ddev yarn install --immutable
          - fixture: ddevProjYarn1
            install: ddev yarn install --frozen-lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @todo Pin to a release once one supports version: head (ddev/github-action-setup-ddev#57).
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76 # main
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}
          version: ${{ matrix.version }}

      - uses: ./
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}

      - name: Install dependencies to fill the cache
        working-directory: tests/fixtures/${{ matrix.fixture }}
        env:
          INSTALL: ${{ matrix.install }}
        run: eval "$INSTALL"

  # Runs the action before DDEV starts, then installs without network access.
  cache-restore:
    needs: cache-save
    name: cache-restore (${{ matrix.fixture }}, DDEV ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        # Same as cache-save.
        version: ['1.23.5', '1.24.10', latest, head]
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
        fixture: [ddevProjComposerNpm, ddevProjYarn1, ddevProjYarn4]
        include:
          # GIT_ALLOW_PROTOCOL stops Composer's fallback to cloning from source, and the
          # unreachable registries stop Corepack and Yarn from downloading.
          - fixture: ddevProjComposerNpm
            offline: ddev exec 'COMPOSER_DISABLE_NETWORK=1 GIT_ALLOW_PROTOCOL=file composer install' && ddev npm ci --offline && ddev exec --dir /var/www/html/web/themes/custom/example npm ci --offline
          - fixture: ddevProjYarn4
            offline: ddev exec 'COREPACK_NPM_REGISTRY=http://127.0.0.1:9 YARN_NPM_REGISTRY_SERVER=http://127.0.0.1:9 yarn install --immutable'
          - fixture: ddevProjYarn1
            offline: ddev yarn install --frozen-lockfile --offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @todo Pin to a release once one supports version: head (ddev/github-action-setup-ddev#57).
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76 # main
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}
          version: ${{ matrix.version }}
          autostart: false

      # cache-save had no installed packages when it built the key, so "Cache
      # restored" fails if these lock files change it.
      - name: Add lock files the cache key must ignore
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: |
          mkdir -p vendor/example/package node_modules/example
          echo '{}' > vendor/example/package/composer.lock
          echo '{}' > node_modules/example/package-lock.json
          echo '{}' > node_modules/example/yarn.lock

      - uses: ./
        id: cache
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}

      - name: Cache restored
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = 'true'

      - name: Remove the ignored lock files
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: rm -r vendor node_modules

      - name: Start DDEV
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: ddev start

      - name: Install dependencies without network access
        working-directory: tests/fixtures/${{ matrix.fixture }}
        env:
          OFFLINE: ${{ matrix.offline }}
        run: eval "$OFFLINE"

  # The last release before the minimum in action.yml must fail.
  too-old:
    name: Fails on DDEV 1.22
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @todo Pin to a release once one supports version: head (ddev/github-action-setup-ddev#57).
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76 # main
        with:
          ddevDir: tests/fixtures/ddevProjComposerNpm
          version: '1.22.7'
          autostart: false

      - uses: ./
        id: cache
        continue-on-error: true
        with:
          ddevDir: tests/fixtures/ddevProjComposerNpm

      - name: Action failed
        env:
          OUTCOME: ${{ steps.cache.outcome }}
        run: test "$OUTCOME" = 'failure'

  # One check for the ci ruleset to require, instead of every matrix job.
  tests:
    name: All tests
    needs: [cache-save, cache-restore, too-old]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All tests passed
        env:
          RESTORE: ${{ needs.cache-restore.result }}
          TOO_OLD: ${{ needs.too-old.result }}
        run: test "$RESTORE" = 'success' && test "$TOO_OLD" = 'success'
