name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Starts DDEV before the action, so the action restarts it.
  cache-save:
    name: cache-save (${{ matrix.fixture }}, DDEV ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        # The oldest version ddev/github-action-setup-ddev tests, the latest release, and HEAD.
        version: ['1.24.8', latest, head]
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
        fixture: [ddevProjComposerNpm, ddevProjYarn4]
        include:
          - fixture: ddevProjComposerNpm
            install: ddev composer install && ddev npm ci
          - fixture: ddevProjYarn4
            install: ddev yarn install --immutable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @todo Pin to a release once one supports version: head (ddev/github-action-setup-ddev#57).
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76 # main
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}
          version: ${{ matrix.version }}

      - uses: ./
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}

      - name: Install dependencies to fill the cache
        working-directory: tests/fixtures/${{ matrix.fixture }}
        env:
          INSTALL: ${{ matrix.install }}
        run: eval "$INSTALL"

  # Runs the action before DDEV starts, then installs without network access.
  cache-restore:
    needs: cache-save
    name: cache-restore (${{ matrix.fixture }}, DDEV ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        # The oldest version ddev/github-action-setup-ddev tests, the latest release, and HEAD.
        version: ['1.24.8', latest, head]
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
        fixture: [ddevProjComposerNpm, ddevProjYarn4]
        include:
          - fixture: ddevProjComposerNpm
            offline: ddev exec 'COMPOSER_DISABLE_NETWORK=1 composer install' && ddev npm ci --offline
          - fixture: ddevProjYarn4
            offline: ddev exec 'YARN_NPM_REGISTRY_SERVER=http://127.0.0.1:9 yarn install --immutable'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @todo Pin to a release once one supports version: head (ddev/github-action-setup-ddev#57).
      - uses: ddev/github-action-setup-ddev@222a22f69087994aeb075fd87c45a8c8cd61ae76 # main
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}
          version: ${{ matrix.version }}
          autostart: false

      - uses: ./
        id: cache
        with:
          ddevDir: tests/fixtures/${{ matrix.fixture }}

      - name: Cache restored
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = 'true'

      - name: Start DDEV
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: ddev start

      - name: Install dependencies without network access
        working-directory: tests/fixtures/${{ matrix.fixture }}
        env:
          OFFLINE: ${{ matrix.offline }}
        run: eval "$OFFLINE"
